[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "study-buddy-api"
version = "0.1.0"
description = "FastAPI backend for the Study Buddy React application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
